<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Eggy's Mandarin 🌸</title>
    
    <!-- iOS & PWA Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Eggy's Mandarin">
    <meta name="theme-color" content="#fcf8f5">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/Yenwen6281/mandarin-subtitles/854cab3f7b910a95391b99dfa7d881b22543524f/c1.png">
    
    <!-- Inline Web App Manifest -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"Eggy&#39;s Mandarin","short_name":"EggyMandarin","start_url":".","display":"standalone","background_color":"#fcf8f5","theme_color":"#fcf8f5","icons":[{"src":"https://raw.githubusercontent.com/Yenwen6281/mandarin-subtitles/854cab3f7b910a95391b99dfa7d881b22543524f/c1.png","sizes":"192x192","type":"image/png"}]}'>

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Firebase SDK (v10 compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        button, .tab-btn, .mode-picker-card, .deck-badge, .ghost-btn, .fc-btn, .ponyo-btn {
            -webkit-user-select: none;
            user-select: none;
            cursor: pointer;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #fcf8f5;
            color: #5c4a4d;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            touch-action: pan-y;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(252, 248, 245, 0.94);
            backdrop-filter: blur(12px);
            border-bottom: 2px dashed rgba(245, 205, 226, 0.8);
            padding: calc(env(safe-area-inset-top, 12px) + 8px) 18px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title-box h1 {
            margin: 0;
            font-size: 20px;
            color: #e08b9b;
            letter-spacing: 0.5px;
        }

        .header-title-box p {
            margin: 2px 0 0;
            font-size: 11.5px;
            color: #a38c90;
            font-weight: 600;
        }

        .nav-tabs {
            display: flex;
            background: rgba(245, 205, 226, 0.35);
            padding: 5px;
            border-radius: 24px;
            gap: 6px;
            margin: 12px 18px 0;
            box-shadow: inset 0 2px 4px rgba(220, 160, 180, 0.15);
        }

        .tab-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 18px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            color: #7b6267;
            background: transparent;
            outline: none;
            transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease;
        }

        .tab-btn:active {
            transform: translateY(2.5px) scale(0.95) !important;
        }

        .tab-btn.active {
            background: linear-gradient(180deg, #ffffff 0%, #faeef3 100%);
            color: #e08b9b;
            box-shadow: 0 3px 0 #e2becb, 0 4px 8px rgba(224, 139, 155, 0.2), inset 0 1px 1px #ffffff;
            transform: translateY(-1px);
        }

        .tab-btn.active:active {
            transform: translateY(2px) scale(0.95) !important;
            box-shadow: 0 1px 0 #e2becb, inset 0 1.5px 2px rgba(180, 120, 130, 0.2);
        }

        main {
            flex: 1;
            padding: 14px 18px calc(env(safe-area-inset-bottom, 20px) + 40px);
            display: flex;
            flex-direction: column;
        }

        /* Login Screen */
        #auth-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #f5cde2;
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 12px 28px rgba(200, 150, 160, 0.18);
            max-width: 320px;
            width: 100%;
        }

        .login-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(180deg, #ffffff 0%, #faeef3 100%);
            border: 1.5px solid #f5cde2;
            color: #5c4a4d;
            border-radius: 16px;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 800;
            font-family: inherit;
            outline: none;
            box-shadow: 0 4px 0 #e2becb, 0 6px 12px rgba(200, 150, 160, 0.2), inset 0 1px 1px #ffffff;
            transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease;
        }
        .login-btn:active {
            transform: translateY(3.5px) scale(0.96) !important;
            box-shadow: 0 1px 0 #e2becb, inset 0 1.5px 2px rgba(180, 120, 130, 0.2);
        }

        /* Controls */
        .controls-card {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 14px;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid #f5cde2;
            background: rgba(255, 255, 255, 0.9);
            font-family: inherit;
            font-size: 13.5px;
            color: #5c4a4d;
            outline: none;
            box-shadow: inset 0 1px 3px rgba(220, 160, 180, 0.12);
        }

        .select-row {
            display: flex;
            gap: 8px;
        }

        .filter-select {
            flex: 1;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid #f5cde2;
            background: rgba(255, 255, 255, 0.9);
            font-family: inherit;
            font-size: 12px;
            color: #5c4a4d;
            outline: none;
        }

        /* Vocabulary Cards */
        .vocab-card {
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid rgba(250, 227, 239, 0.85);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(200, 150, 160, 0.12);
        }

        .vocab-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .vocab-title {
            font-size: 24px;
            font-weight: 800;
            color: #e08b9b;
        }

        .vocab-pinyin {
            font-size: 14px;
            color: #d09b9f;
            font-style: italic;
            margin: 2px 0 8px;
        }

        .vocab-level {
            font-size: 11px;
            background: #f5cde2;
            color: #5c4a4d;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 700;
        }

        .vocab-defs {
            margin: 0;
            padding-left: 18px;
            font-size: 14px;
            line-height: 1.5;
            color: #5c4a4d;
        }

        /* Editable Sticky Note */
        .sticky-note-box {
            margin-top: 10px;
            background: #fff9e6;
            border: 1px solid #fbe7b2;
            border-radius: 10px;
            padding: 8px 10px;
            box-shadow: 0 2px 6px rgba(220, 190, 140, 0.2);
        }

        .sticky-note-input {
            width: 100%;
            border: none;
            background: transparent;
            resize: none;
            font-size: 12.5px;
            color: #5c4a4d;
            font-family: inherit;
            outline: none;
            line-height: 1.35;
        }

        .sticky-note-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px dashed rgba(220, 190, 140, 0.4);
            padding-top: 4px;
            margin-top: 4px;
        }

        .bean-note-box {
            margin-top: 10px;
            background: #eef7fc;
            border: 1.5px solid #c9e4f5;
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 12.5px;
            color: #406277;
            line-height: 1.4;
        }

        .card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px dashed rgba(245, 205, 226, 0.6);
        }

        .deck-badge {
            font-size: 11.5px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.85);
            background: linear-gradient(180deg, #ffffff 0%, #fae6ed 100%);
            color: #7b6267;
            box-shadow: 0 3px 0 #d9a8b6, 0 3px 6px rgba(224, 139, 155, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.9);
            outline: none;
            transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease;
        }
        .deck-badge:active {
            transform: translateY(2.5px) scale(0.94) !important;
            box-shadow: 0 0.5px 0 #d9a8b6, inset 0 1.5px 2px rgba(180, 110, 125, 0.25);
        }
        .deck-badge.in-deck {
            background: linear-gradient(180deg, #ffc7d5 0%, #e08b9b 100%);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 3px 0 #ba6273, 0 4px 8px rgba(224, 139, 155, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.6);
        }
        .deck-badge.in-deck:active {
            transform: translateY(2.5px) scale(0.94) !important;
            box-shadow: 0 0.5px 0 #ba6273, inset 0 2px 3px rgba(140, 50, 65, 0.35);
        }

        /* Mode Picker Art Cards */
        .mode-picker-card {
            border-radius: 18px;
            padding: 20px 16px;
            margin-bottom: 14px;
            border: 1.5px solid rgba(245, 205, 226, 0.85);
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 135px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 0 #e4b8ca, 0 10px 18px rgba(200, 150, 160, 0.3);
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease;
        }
        .mode-picker-card:active {
            transform: translateY(5px) scale(0.96) !important;
            box-shadow: 0 1px 0 #e4b8ca, 0 3px 6px rgba(200, 150, 160, 0.2);
        }
        .mode-picker-card.card-b1 {
            background-image: url('https://raw.githubusercontent.com/Yenwen6281/mandarin-subtitles/0e228accc04a786e15a9f8aa271166eee7a5f2b6/b1.png');
        }
        .mode-picker-card.card-b2 {
            background-image: url('https://raw.githubusercontent.com/Yenwen6281/mandarin-subtitles/8651c6a44f1b8e7f87d4654e96e8bdc7c4ef52ae/b2.png');
        }

        .fc-start-pill {
            background: linear-gradient(180deg, #ffffff 0%, #fae6ed 100%);
            color: #e08b9b;
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 6px 20px;
            font-weight: 800;
            font-size: 13.5px;
            box-shadow: 0 3px 0 #d9a8b6, 0 3px 6px rgba(224, 139, 155, 0.22), inset 0 1px 1px #ffffff;
        }

        /* 3D Flashcard Module - Exact Netflix 300x280 Aspect Frame */
        #fc-session-box, #fc-setup-box {
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
        }

        .flashcard-wrapper {
            perspective: 1200px;
            width: 100%;
            max-width: 300px;
            height: 280px;
            margin: 10px auto 0;
            position: relative;
        }

        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
            cursor: pointer;
            will-change: transform;
        }

        .flashcard-inner.is-flipped {
            transform: rotateY(180deg);
        }

        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(200, 150, 160, 0.2);
            border: 2px solid #f5cde2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            background-size: cover !important;
            background-repeat: no-repeat !important;
        }

        .flashcard-back {
            transform: rotateY(180deg);
            align-items: flex-start;
            text-align: left;
            overflow-y: auto;
        }

        .fc-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            width: 100%;
        }

        /* 3D Physical Squish Feedback on Buttons */
        .fc-btn {
            flex: 1;
            padding: 12px;
            border-radius: 14px;
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            font-weight: 800;
            font-size: 13.5px;
            letter-spacing: 0.3px;
            font-family: inherit;
            outline: none;
            box-shadow: 0 4.5px 0 #b38c94, 0 6px 12px rgba(180, 140, 150, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.9);
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.9);
            transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease;
        }
        .fc-btn:active {
            transform: translateY(4px) scale(0.95) !important;
            box-shadow: 0 0.5px 0 #b38c94, inset 0 2px 4px rgba(140, 100, 110, 0.3);
        }
        .fc-btn-learn {
            background-image: linear-gradient(rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0.45)), url('https://raw.githubusercontent.com/Yenwen6281/mandarin-subtitles/332fb8d639e5fc8f7fffc7bb2e1993fa67727681/f1.jpeg');
            background-size: cover;
            color: #5c4a4d;
        }
        .fc-btn-gotit {
            background-image: linear-gradient(rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0.45)), url('https://raw.githubusercontent.com/Yenwen6281/mandarin-subtitles/332fb8d639e5fc8f7fffc7bb2e1993fa67727681/f2.jpg');
            background-size: cover;
            color: #5c4a4d;
        }

        .ponyo-btn {
            background: none;
            border: none;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            outline: none;
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .ponyo-btn img {
            width: 50px;
            height: auto;
            filter: drop-shadow(1px 2px 3px rgba(150, 180, 200, 0.4));
        }
        .ponyo-btn:active {
            transform: translateY(2px) scale(0.86, 0.82) !important;
        }

        .ghost-btn {
            background: linear-gradient(180deg, #ffffff 0%, #faeef3 100%);
            border: 1px solid #f5cde2;
            color: #7b6267;
            border-radius: 12px;
            padding: 6px 14px;
            font-size: 11.5px;
            font-family: inherit;
            font-weight: 700;
            outline: none;
            box-shadow: 0 2.5px 0 #e2becb, 0 3px 6px rgba(200, 150, 160, 0.15), inset 0 1px 1px #ffffff;
            transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease;
        }
        .ghost-btn:active {
            transform: translateY(2px) scale(0.93) !important;
            box-shadow: 0 0.5px 0 #e2becb, inset 0 1.5px 2px rgba(180, 120, 130, 0.2);
        }

        .sync-box {
            background: #fff;
            border: 2px solid #f5cde2;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 16px;
            text-align: center;
            box-shadow: 0 4px 14px rgba(200, 150, 160, 0.15);
        }

        .sync-key-pill {
            display: inline-block;
            background: #f7eaf0;
            color: #e08b9b;
            font-family: monospace;
            font-size: 13px;
            font-weight: 700;
            padding: 8px 14px;
            border-radius: 12px;
            margin: 8px 0 14px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-title-box">
            <h1>Eggy's Mandarin</h1>
            <p id="user-display-email">Connecting...</p>
        </div>
        <button id="logout-btn" class="ghost-btn" style="display: none;">Sign Out</button>
    </header>

    <!-- Sign In View -->
    <div id="auth-view">
        <div class="login-card">
            <img src="https://raw.githubusercontent.com/Yenwen6281/mandarin-subtitles/854cab3f7b910a95391b99dfa7d881b22543524f/c1.png" style="width: 85px; height: auto; margin-bottom: 16px;" alt="Logo">
            <h2 style="margin: 0 0 6px; color: #e08b9b; font-size: 20px;">Welcome Bub!</h2>
            <p style="margin: 0 0 24px; font-size: 13px; color: #a38c90;">Sign in with Google to sync your saved words & flashcards on mobile.</p>
            <button id="google-login-btn" class="login-btn">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                Sign in with Google
            </button>
        </div>
    </div>

    <!-- Main View -->
    <div id="app-view" style="display: none; flex-direction: column; flex: 1;">
        <div class="nav-tabs">
            <button class="tab-btn active" id="tab-btn-vocab">Saved Words</button>
            <button class="tab-btn" id="tab-btn-flash">Flashcards</button>
            <button class="tab-btn" id="tab-btn-sync">Sync Key</button>
        </div>

        <main>
            <!-- 1. Saved Words View -->
            <section id="vocab-view">
                <div class="controls-card">
                    <input type="text" id="vocab-search" class="search-input" placeholder="🔍 Search word, pinyin, meaning...">
                    <div class="select-row">
                        <select id="vocab-filter" class="filter-select">
                            <option value="all">All Words</option>
                            <option value="deck">In Flashcard Deck</option>
                            <option value="notes">Has Note</option>
                            <option value="bean">Has Bean's Note</option>
                        </select>
                        <select id="vocab-sort" class="filter-select">
                            <option value="time_desc">Newest First</option>
                            <option value="time_asc">Oldest First</option>
                            <option value="hsk_asc">HSK: 1 ➔ 6</option>
                            <option value="hsk_desc">HSK: 6 ➔ 1</option>
                        </select>
                    </div>
                </div>

                <div id="vocab-list-container"></div>
            </section>

            <!-- 2. Flashcards View -->
            <section id="flash-view" style="display: none; flex-direction: column; align-items: center;">
                <div id="fc-setup-box">
                    <div style="margin-bottom: 14px; text-align: center;">
                        <span id="fc-count-pill" style="font-size: 13px; font-weight: 700; color: #e08b9b; background: rgba(255, 240, 245, 0.95); border: 1px solid rgba(245, 205, 226, 0.7); padding: 4px 14px; border-radius: 14px;">
                            0 Words
                        </span>
                    </div>

                    <div id="fc-mode-hanzi" class="mode-picker-card card-b1">
                        <div style="font-size: 21px; font-weight: 800; color: #5c4a4d; margin-bottom: 10px;">Hanzi First</div>
                        <span class="fc-start-pill">Start ▶</span>
                    </div>

                    <div id="fc-mode-english" class="mode-picker-card card-b2">
                        <div style="font-size: 21px; font-weight: 800; color: #5c4a4d; margin-bottom: 10px;">English First</div>
                        <span class="fc-start-pill">Start ▶</span>
                    </div>

                    <div style="text-align: center;">
                        <button id="fc-clear-deck-btn" class="ghost-btn" style="margin-top: 10px;">Clear Deck 🧹</button>
                    </div>
                </div>

                <!-- Flashcard Active Session -->
                <div id="fc-session-box" style="display: none;">
                    <div style="display: flex; justify-content: space-between; font-size: 12px; color: #a38c90; font-weight: 700; margin-bottom: 6px;">
                        <span id="fc-left-counter">Cards Left: 0</span>
                        <span id="fc-quit-btn" style="color: #8ba6b6; cursor: pointer; text-decoration: underline;">Quit</span>
                    </div>

                    <div class="flashcard-wrapper" id="fc-swipe-container">
                        <div class="flashcard-inner" id="fc-card-inner">
                            <div class="flashcard-face" id="fc-face-front"></div>
                            <div class="flashcard-face flashcard-back" id="fc-face-back"></div>
                        </div>
                    </div>

                    <div class="fc-controls" id="fc-controls-bar" style="opacity: 0.4; pointer-events: none;">
                        <button id="fc-btn-learn" class="fc-btn fc-btn-learn">Still Learning</button>
                        <button id="fc-btn-gotit" class="fc-btn fc-btn-gotit">Got It !</button>
                    </div>
                </div>
            </section>

            <!-- 3. Sync Key View -->
            <section id="sync-view" style="display: none;">
                <div class="sync-box">
                    <h3 style="margin: 0 0 6px; color: #e08b9b;">Your Netflix Sync Key</h3>
                    <p style="margin: 0 0 10px; font-size: 13px; color: #7b6267;">Copy this key and paste it into the Netflix UserScript menu on your Mac.</p>
                    <div class="sync-key-pill" id="sync-key-display">Loading...</div>
                    <div>
                        <button id="copy-sync-key-btn" class="ghost-btn" style="background: linear-gradient(180deg, #ffffff 0%, #fae6ed 100%); color: #e08b9b; border-color: #f5cde2; font-weight: 800; padding: 8px 16px;">📋 Copy Sync Key</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // Enable instantaneous iOS Safari / PWA :active states on touch
        document.addEventListener("touchstart", function() {}, { passive: true });

        // --- 0. ASSET CONSTANTS ---
        const PONYO_IMG_URL = "https://raw.githubusercontent.com/Yenwen6281/mandarin-subtitles/2d078edf50412736a35f4427cde45c533d310fa3/ponyo-removebg-preview.png";
        const WOODSTOCK_IMG_URL = "https://raw.githubusercontent.com/Yenwen6281/mandarin-subtitles/dafd9d8981693cfc1ceb84a26c85442dcb9716da/woodstock.png";
        const COMPLETE_DECK_IMG_URL = "https://raw.githubusercontent.com/Yenwen6281/mandarin-subtitles/45c35941f24aabe020891bdc3d9df53ec0aff55f/c2.png";

        const FLASHCARD_BG_IMAGES_HANZI = [
            'https://raw.githubusercontent.com/Yenwen6281/mandarin-subtitles/98ab0023e1c510c6ee108fe5098afbfe1adbc8f6/d1.png',
            'https://raw.githubusercontent.com/Yenwen6281/mandarin-subtitles/98ab0023e1c510c6ee108fe5098afbfe1adbc8f6/d2.png',
            'https://raw.githubusercontent.com/Yenwen6281/mandarin-subtitles/98ab0023e1c510c6ee108fe5098afbfe1adbc8f6/d3.png',
            'https://raw.githubusercontent.com/Yenwen6281/mandarin-subtitles/98ab0023e1c510c6ee108fe5098afbfe1adbc8f6/d4.png',
            'https://raw.githubusercontent.com/Yenwen6281/mandarin-subtitles/98ab0023e1c510c6ee108fe5098afbfe1adbc8f6/d5.png'
        ];

        const FLASHCARD_BG_IMAGES_ENGLISH = [
            'https://raw.githubusercontent.com/Yenwen6281/mandarin-subtitles/83f32298468c63d9f2368dc328702ed6f301eb60/e1.jpg',
            'https://raw.githubusercontent.com/Yenwen6281/mandarin-subtitles/83f32298468c63d9f2368dc328702ed6f301eb60/e2.jpg',
            'https://raw.githubusercontent.com/Yenwen6281/mandarin-subtitles/83f32298468c63d9f2368dc328702ed6f301eb60/e3.jpg',
            'https://raw.githubusercontent.com/Yenwen6281/mandarin-subtitles/83f32298468c63d9f2368dc328702ed6f301eb60/e4.jpg',
            'https://raw.githubusercontent.com/Yenwen6281/mandarin-subtitles/83f32298468c63d9f2368dc328702ed6f301eb60/e5.jpg'
        ];

        // --- 1. FIREBASE INITIALIZATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyBGhMMd6fd2oK23J-YA27VYXFGh69R1PA0",
            authDomain: "lltfliss-ce07a.firebaseapp.com",
            projectId: "lltfliss-ce07a",
            storageBucket: "lltfliss-ce07a.firebasestorage.app",
            messagingSenderId: "839671719751",
            appId: "1:839671719751:web:063a638ed2c7eb984f4e62",
            measurementId: "G-RR57EXPBH6"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        db.enablePersistence().catch(err => console.warn("Firestore cache enabled fallback:", err.code));

        let currentUser = null;
        let unsubscribeVocab = null;
        let vocabList = [];
        let flashcardSessionCount = 0;

        // --- 2. AUTH FLOW ---
        const authView = document.getElementById('auth-view');
        const appView = document.getElementById('app-view');
        const googleLoginBtn = document.getElementById('google-login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const userDisplayEmail = document.getElementById('user-display-email');
        const syncKeyDisplay = document.getElementById('sync-key-display');

        googleLoginBtn.addEventListener('click', () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(err => alert("Login Error: " + err.message));
        });

        logoutBtn.addEventListener('click', () => {
            if (confirm("Sign out of Eggy's Mandarin?")) auth.signOut();
        });

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                authView.style.display = 'none';
                appView.style.display = 'flex';
                logoutBtn.style.display = 'inline-block';
                userDisplayEmail.textContent = user.email;
                syncKeyDisplay.textContent = user.uid;

                listenToCloudData(user.uid);
            } else {
                currentUser = null;
                if (unsubscribeVocab) unsubscribeVocab();
                authView.style.display = 'flex';
                appView.style.display = 'none';
                logoutBtn.style.display = 'none';
                userDisplayEmail.textContent = "Please sign in";
            }
        });

        document.getElementById('copy-sync-key-btn').addEventListener('click', () => {
            if (currentUser) {
                navigator.clipboard.writeText(currentUser.uid).then(() => alert("Sync Key copied to clipboard! 🌷"));
            }
        });

        // --- 3. FIRESTORE REALTIME SYNC ---
        function listenToCloudData(uid) {
            if (unsubscribeVocab) unsubscribeVocab();

            unsubscribeVocab = db.collection('users').doc(uid).collection('vocab')
                .onSnapshot(snapshot => {
                    vocabList = [];
                    snapshot.forEach(doc => vocabList.push({ id: doc.id, ...doc.data() }));
                    renderSavedVocab();
                    updateFlashcardCounts();
                }, err => console.error("Firestore sync error:", err));
        }

        // --- 4. TABS NAVIGATION ---
        const tabBtnVocab = document.getElementById('tab-btn-vocab');
        const tabBtnFlash = document.getElementById('tab-btn-flash');
        const tabBtnSync = document.getElementById('tab-btn-sync');
        const vocabView = document.getElementById('vocab-view');
        const flashView = document.getElementById('flash-view');
        const syncView = document.getElementById('sync-view');

        function switchTab(activeBtn, activeSection) {
            [tabBtnVocab, tabBtnFlash, tabBtnSync].forEach(b => b.classList.remove('active'));
            [vocabView, flashView, syncView].forEach(s => s.style.display = 'none');
            activeBtn.classList.add('active');
            activeSection.style.display = activeSection === flashView ? 'flex' : 'block';
        }

        tabBtnVocab.addEventListener('click', () => switchTab(tabBtnVocab, vocabView));
        tabBtnFlash.addEventListener('click', () => switchTab(tabBtnFlash, flashView));
        tabBtnSync.addEventListener('click', () => switchTab(tabBtnSync, syncView));

        // --- 5. SAVED WORDS MODULE WITH IN-APP EDITING ---
        const vocabListContainer = document.getElementById('vocab-list-container');
        const searchInput = document.getElementById('vocab-search');
        const filterSelect = document.getElementById('vocab-filter');
        const sortSelect = document.getElementById('vocab-sort');

        [searchInput, filterSelect, sortSelect].forEach(el => el.addEventListener('input', renderSavedVocab));

        function renderSavedVocab() {
            let filtered = [...vocabList];
            const query = (searchInput.value || '').toLowerCase().trim();
            const filterVal = filterSelect.value;
            const sortVal = sortSelect.value;

            if (query) {
                filtered = filtered.filter(v => 
                    (v.hanzi || '').includes(query) ||
                    (v.pinyin || '').toLowerCase().includes(query) ||
                    (v.translations || []).some(t => t.toLowerCase().includes(query))
                );
            }

            if (filterVal === 'deck') filtered = filtered.filter(v => !!v.inDeck);
            else if (filterVal === 'notes') filtered = filtered.filter(v => (v.note || '').trim().length > 0);
            else if (filterVal === 'bean') filtered = filtered.filter(v => (v.beanReply || '').trim().length > 0);

            if (sortVal === 'time_desc') filtered.sort((a,b) => (b.updatedAt || 0) - (a.updatedAt || 0));
            else if (sortVal === 'time_asc') filtered.sort((a,b) => (a.updatedAt || 0) - (b.updatedAt || 0));
            else if (sortVal === 'hsk_asc') filtered.sort((a,b) => (a.level || 99) - (b.level || 99));
            else if (sortVal === 'hsk_desc') filtered.sort((a,b) => (b.level || 99) - (a.level || 99));

            if (filtered.length === 0) {
                vocabListContainer.innerHTML = `<div style="text-align:center; color:#a38c90; margin-top:40px; font-style:italic;">No words found 🐣</div>`;
                return;
            }

            vocabListContainer.innerHTML = '';
            filtered.forEach(vocab => {
                const card = document.createElement('div');
                card.className = 'vocab-card';

                const defsHtml = (vocab.translations || []).map(t => `<li style="margin-bottom:2px;">${t}</li>`).join('');
                const currentNote = vocab.note || '';

                card.innerHTML = `
                    <div class="vocab-header">
                        <div style="display: flex; align-items: center; gap: 2px;">
                            <span class="vocab-title">${vocab.hanzi}</span>
                            <button class="ponyo-btn card-speak-btn" title="Listen">
                                <img src="${PONYO_IMG_URL}" alt="Speak">
                            </button>
                        </div>
                        <span class="vocab-level">HSK ${vocab.level || '?'}</span>
                    </div>
                    <div class="vocab-pinyin">${vocab.pinyin || ''}</div>
                    <ul class="vocab-defs">${defsHtml}</ul>

                    <div class="sticky-note-box">
                        <textarea class="sticky-note-input" maxlength="50" rows="2" placeholder="Tap to write note (50 chars)...">${currentNote}</textarea>
                        <div class="sticky-note-footer">
                            <span class="char-count" style="font-size:10.5px; color:#cf9664; font-weight:700;">${currentNote.length}/50</span>
                            <span class="note-status" style="font-size:10px; color:#a38c90;">Auto-saved</span>
                        </div>
                    </div>

                    ${vocab.beanReply ? `
                        <div class="bean-note-box">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;">
                                <b style="color:#2e5973;">💬 Bean's Note:</b>
                                <img src="${WOODSTOCK_IMG_URL}" style="width:28px; height:auto;" alt="Woodstock">
                            </div>
                            <div>${vocab.beanReply}</div>
                        </div>
                    ` : ''}

                    <div class="card-actions">
                        <button class="deck-badge ${vocab.inDeck ? 'in-deck' : ''}">
                            ${vocab.inDeck ? '✓ Flashcard' : '+ Flashcard'}
                        </button>
                        <button class="ghost-btn delete-vocab-btn" style="color: #ba6273;">Unsave</button>
                    </div>
                `;

                // Audio
                card.querySelector('.card-speak-btn').addEventListener('click', () => playTTS(vocab.hanzi));

                // Deck Toggle
                card.querySelector('.deck-badge').addEventListener('click', () => {
                    db.collection('users').doc(currentUser.uid).collection('vocab').doc(vocab.hanzi).update({
                        inDeck: !vocab.inDeck,
                        updatedAt: Date.now()
                    });
                });

                // Unsave Word
                card.querySelector('.delete-vocab-btn').addEventListener('click', () => {
                    if (confirm(`Remove "${vocab.hanzi}" from saved words?`)) {
                        db.collection('users').doc(currentUser.uid).collection('vocab').doc(vocab.hanzi).delete();
                    }
                });

                // Sticky Note Live Edit
                const textarea = card.querySelector('.sticky-note-input');
                const charCount = card.querySelector('.char-count');
                const noteStatus = card.querySelector('.note-status');
                let debounceTimeout = null;

                textarea.addEventListener('input', (e) => {
                    const val = e.target.value;
                    charCount.textContent = `${val.length}/50`;
                    noteStatus.textContent = "Saving...";

                    clearTimeout(debounceTimeout);
                    debounceTimeout = setTimeout(() => {
                        db.collection('users').doc(currentUser.uid).collection('vocab').doc(vocab.hanzi).update({
                            note: val,
                            updatedAt: Date.now()
                        }).then(() => {
                            noteStatus.textContent = "Saved ☁️";
                        });
                    }, 650);
                });

                vocabListContainer.appendChild(card);
            });
        }

        // --- 6. 3D FLASHCARDS WITH GESTURE SWIPES & THEMES ---
        const fcSetupBox = document.getElementById('fc-setup-box');
        const fcSessionBox = document.getElementById('fc-session-box');
        const fcCountPill = document.getElementById('fc-count-pill');
        const fcModeHanziBtn = document.getElementById('fc-mode-hanzi');
        const fcModeEnBtn = document.getElementById('fc-mode-english');
        const fcClearDeckBtn = document.getElementById('fc-clear-deck-btn');
        const fcQuitBtn = document.getElementById('fc-quit-btn');
        const fcLeftCounter = document.getElementById('fc-left-counter');
        const fcSwipeContainer = document.getElementById('fc-swipe-container');
        const fcCardInner = document.getElementById('fc-card-inner');
        const fcFaceFront = document.getElementById('fc-face-front');
        const fcFaceBack = document.getElementById('fc-face-back');
        const fcControlsBar = document.getElementById('fc-controls-bar');
        const fcBtnLearn = document.getElementById('fc-btn-learn');
        const fcBtnGotit = document.getElementById('fc-btn-gotit');

        let fcQueue = [];
        let fcMode = 'hanzi';
        let fcIsFlipped = false;

        function updateFlashcardCounts() {
            const deckWords = vocabList.filter(v => v.inDeck);
            fcCountPill.textContent = `${deckWords.length} Words in Deck`;
        }

        fcClearDeckBtn.addEventListener('click', () => {
            if (confirm("Remove all words from the flashcard deck?")) {
                const batch = db.batch();
                vocabList.filter(v => v.inDeck).forEach(v => {
                    const ref = db.collection('users').doc(currentUser.uid).collection('vocab').doc(v.hanzi);
                    batch.update(ref, { inDeck: false, updatedAt: Date.now() });
                });
                batch.commit();
            }
        });

        function startFlashcardSession(mode) {
            const deckWords = vocabList.filter(v => v.inDeck);
            if (deckWords.length === 0) {
                alert("Your study deck is empty! Tap '+ Flashcard' on any saved word first 🌸");
                return;
            }
            fcMode = mode;
            fcQueue = [...deckWords].sort(() => Math.random() - 0.5);
            flashcardSessionCount = 0;
            fcSetupBox.style.display = 'none';
            fcSessionBox.style.display = 'block';
            renderNextFlashcard();
        }

        fcModeHanziBtn.addEventListener('click', () => startFlashcardSession('hanzi'));
        fcModeEnBtn.addEventListener('click', () => startFlashcardSession('en'));

        fcQuitBtn.addEventListener('click', () => {
            fcSessionBox.style.display = 'none';
            fcSetupBox.style.display = 'block';
        });

        function renderNextFlashcard() {
            if (fcQueue.length === 0) {
                fcSessionBox.innerHTML = `
                    <div style="text-align:center; padding:30px 10px;">
                        <img src="${COMPLETE_DECK_IMG_URL}" style="width:75px; height:auto; border-radius:12px; margin-bottom:12px;" alt="Done">
                        <h3 style="color:#e08b9b; margin:0 0 4px;">Deck Complete!</h3>
                        <p style="color:#7b6267; font-size:13px; font-weight:700;">Well done bub!</p>
                        <button id="fc-finish-btn" class="login-btn" style="margin-top:16px;">Back to Decks 🌷</button>
                    </div>
                `;
                document.getElementById('fc-finish-btn').addEventListener('click', () => location.reload());
                return;
            }

            fcIsFlipped = false;
            fcCardInner.classList.remove('is-flipped');
            fcControlsBar.style.opacity = '0.4';
            fcControlsBar.style.pointerEvents = 'none';

            const vocab = fcQueue[0];
            fcLeftCounter.textContent = `Cards Left: ${fcQueue.length}`;

            // Rotating Background Texture
            const activeSet = fcMode === 'en' ? FLASHCARD_BG_IMAGES_ENGLISH : FLASHCARD_BG_IMAGES_HANZI;
            const bgImg = activeSet[flashcardSessionCount % activeSet.length];
            const bgPosition = bgImg.includes('d5.png') ? 'left center' : 'center center';
            const bgStyle = `background: linear-gradient(rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.78)), url('${bgImg}'); background-position: ${bgPosition} !important;`;

            fcFaceFront.style.cssText = bgStyle;
            fcFaceBack.style.cssText = bgStyle;

            if (fcMode === 'hanzi') {
                fcFaceFront.innerHTML = `
                    <span style="position:absolute; top:15px; right:15px; font-size:10px; background:#f5cde2; padding:3px 8px; border-radius:8px; font-weight:700; color:#5c4a4d;">HSK ${vocab.level || '?'}</span>
                    <button class="ponyo-btn fc-speak-btn" style="position:absolute; top:10px; left:10px;" title="Listen">
                        <img src="${PONYO_IMG_URL}" alt="Speak">
                    </button>
                    <div style="font-size: 42px; font-weight: bold; color: #e08b9b; margin-top: 10px;">${vocab.hanzi}</div>
                    <div style="position: absolute; bottom: 20px; font-size: 12px; color: #b89c9e; font-style: italic;">(Tap to flip)</div>
                `;
            } else {
                const defs = (vocab.translations || []).map(t => `<li style="margin-bottom:4px;">${t}</li>`).join('');
                fcFaceFront.innerHTML = `
                    <span style="position:absolute; top:15px; right:15px; font-size:10px; background:#f5cde2; padding:3px 8px; border-radius:8px; font-weight:700; color:#5c4a4d;">HSK ${vocab.level || '?'}</span>
                    <ul style="margin:0; padding-left:20px; font-size:15px; color:#5c4a4d; font-weight:700; text-align:left; width:100%;">${defs}</ul>
                    <div style="position: absolute; bottom: 20px; font-size: 12px; color: #b89c9e; font-style: italic;">(Tap to flip)</div>
                `;
            }

            const defsBack = (vocab.translations || []).map(t => `<li>${t}</li>`).join('');
            fcFaceBack.innerHTML = `
                <div style="display:flex; justify-content:space-between; width:100%; align-items:center;">
                    <div>
                        <div style="font-size: 28px; font-weight: bold; color: #e08b9b;">${vocab.hanzi}</div>
                        <div style="font-size: 14px; color: #d09b9f; font-style: italic;">${vocab.pinyin || ''}</div>
                    </div>
                    <button class="ponyo-btn fc-speak-btn" title="Listen">
                        <img src="${PONYO_IMG_URL}" alt="Speak">
                    </button>
                </div>
                <ul style="margin: 6px 0 10px; padding-left: 18px; font-size: 13px; line-height: 1.4;">${defsBack}</ul>
                ${vocab.note ? `<div class="sticky-note-box" style="margin-bottom:6px; font-size:11px; padding:6px 8px;">📌 ${vocab.note}</div>` : ''}
                ${vocab.beanReply ? `<div class="bean-note-box" style="font-size:11px; padding:6px 8px;">💬 Bean: ${vocab.beanReply}</div>` : ''}
            `;

            fcFaceFront.querySelector('.fc-speak-btn')?.addEventListener('click', (e) => {
                e.stopPropagation();
                playTTS(vocab.hanzi);
            });
            fcFaceBack.querySelector('.fc-speak-btn')?.addEventListener('click', (e) => {
                e.stopPropagation();
                playTTS(vocab.hanzi);
            });
        }

        // Tap to Flip Card with Optional Haptics
        fcCardInner.addEventListener('click', (e) => {
            if (e.target.closest('.ponyo-btn')) return;

            if (!fcIsFlipped) {
                fcIsFlipped = true;
                if (navigator.vibrate) navigator.vibrate(10);
                fcCardInner.classList.add('is-flipped');
                fcControlsBar.style.opacity = '1';
                fcControlsBar.style.pointerEvents = 'auto';

                if (fcMode === 'en') {
                    playTTS(fcQueue[0].hanzi);
                }
            }
        });

        // Still Learning (Push to end)
        function markStillLearning() {
            if (navigator.vibrate) navigator.vibrate(15);
            const card = fcQueue.shift();
            fcQueue.push(card);
            flashcardSessionCount++;
            renderNextFlashcard();
        }

        // Got It (Mastered)
        function markGotIt() {
            if (navigator.vibrate) navigator.vibrate([10, 30]);
            fcQueue.shift();
            flashcardSessionCount++;
            renderNextFlashcard();
        }

        fcBtnLearn.addEventListener('click', markStillLearning);
        fcBtnGotit.addEventListener('click', markGotIt);

        // --- 7. MOBILE TOUCH SWIPE GESTURES ---
        let touchStartX = 0;
        let touchStartY = 0;

        fcSwipeContainer.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        fcSwipeContainer.addEventListener('touchend', (e) => {
            if (!fcIsFlipped) return;

            const deltaX = e.changedTouches[0].clientX - touchStartX;
            const deltaY = e.changedTouches[0].clientY - touchStartY;

            if (Math.abs(deltaX) > 60 && Math.abs(deltaY) < 50) {
                if (deltaX < 0) {
                    markStillLearning();
                } else {
                    markGotIt();
                }
            }
        }, { passive: true });

        // --- 8. AUDIO SYNTHESIS (TTS) ---
        function playTTS(text) {
            try {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            } catch (e) {
                console.warn("TTS error:", e);
            }
        }
    </script>
</body>
</html>
